name: Build company desktop installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-company-desktop.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**'
      - 'public/**'
      - 'tests/**'
  workflow_dispatch:
concurrency:
  group: company-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify accounting and synchronization
        run: npm test
      - name: Build company installer
        run: npm run build:windows:company
      - name: Verify packaged offline runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $installerRoot = (Resolve-Path 'releases/companies/win-unpacked').Path
          $smokeScript = (Resolve-Path 'apps/desktop/packaged-smoke.cjs').Path
          Set-Location $installerRoot
          & './AlMahasibPro-Companies.exe' $smokeScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AlMahasibPro-Companies-Windows
          path: releases/companies/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified company installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          $releaseTag = "desktop-v$releaseVersion"
          $installerPath = (Get-ChildItem 'releases/companies/*-Setup-*-x64.exe' | Select-Object -First 1).FullName
          if (-not $installerPath) { throw 'Installer missing' }
          $hashPath = "$installerPath.sha256.txt"
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLower()
          "$installerHash  $(Split-Path $installerPath -Leaf)" | Set-Content -LiteralPath $hashPath -Encoding utf8
          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'This version is already published; bump the version for a new release.'
          } else {
            gh release create $releaseTag $installerPath $hashPath --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AlMahasibPro Companies $releaseVersion" --notes-file 'docs/company-desktop-1.2.1.md'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
