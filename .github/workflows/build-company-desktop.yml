name: Build company desktop installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-company-desktop.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**'
      - 'public/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify accounting and synchronization
        run: npm test
      - name: Build company installer
        run: npm run build:windows:company
      - uses: actions/upload-artifact@v4
        with:
          name: AlMahasibPro-Companies-Windows
          path: releases/companies/*.exe
          if-no-files-found: error
          retention-days: 30
