<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الماركت والمجمع</title>
<style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#071426;color:#eef2ff}.wrap{max-width:1500px;margin:auto;padding:92px 22px 22px}.topbar{position:fixed;top:0;right:0;left:0;z-index:50;background:#0d1b32;border-bottom:1px solid #29415f;padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.topbar b{color:#ffd43b}.topbar input{width:150px}.head,.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between}.card{background:#10213a;border:1px solid #29415f;border-radius:18px;padding:16px;margin-top:16px}button,input,select{border:1px solid #405a7c;border-radius:10px;padding:10px;background:#0b1a2e;color:#fff}button{cursor:pointer;background:#6d45ff;font-weight:700}.danger{background:#be334d}.green{background:#15935f}.bar input{flex:1;min-width:180px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #29415f;text-align:right}th{color:#ffd43b;position:sticky;top:0;background:#10213a}.scroll{max-height:68vh;overflow:auto}.muted{color:#9fb0c8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#132945;padding:14px;border-radius:14px}.stat b{display:block;font-size:22px;color:#ffd43b}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="topbar"><strong id="topCompany">المجمع</strong><span>الكاشير: <b id="topCashier">الكاشير الرئيسي</b></span><span>الوقت: <b id="topTime">--:--</b></span><span>التاريخ: <b id="topDate">--</b></span><label>الرصيد <input id="topBalance" type="number" min="0" value="0" oninput="saveBalance()"></label></div><div class="wrap"><div class="head"><div><h1>مركز إدارة الماركت والمجمع</h1><div class="muted">الحاسبة الرئيسية — الأصناف والتسعير والباركود</div></div><div><button onclick="location.href='/pos.html?mode=market'">فتح كاشير الماركت</button> <button onclick="location.href='/dashboard.html'">الرئيسية</button></div></div>
<div class="stats"><div class="stat">الأصناف<b id="sCount">0</b></div><div class="stat">الأقسام<b id="sCats">0</b></div><div class="stat">قيمة المخزون<b id="sStock">0</b></div><div class="stat">أصناف منخفضة<b id="sLow">0</b></div></div>
<div class="card"><h3>إضافة / تعديل مادة</h3><div class="bar"><input id="name" placeholder="اسم المادة"><input id="cat" placeholder="القسم"><input id="barcode" placeholder="الباركود — اتركه فارغاً للتوليد"><input id="cost" type="number" min="0" placeholder="سعر الشراء"><input id="price" type="number" min="0" placeholder="سعر البيع"><input id="qty" type="number" min="0" placeholder="الرصيد"><input id="minQty" type="number" min="0" value="5" placeholder="حد التنبيه"><select id="unit"><option>قطعة</option><option>كغم</option><option>لتر</option><option>علبة</option><option>كارتون</option><option>زوج</option></select><button class="green" onclick="save()">حفظ</button><button onclick="clearForm()">جديد</button></div></div>
<div class="card"><div id="categoryCards" class="stats" style="margin-bottom:12px"></div><div class="bar"><input id="q" placeholder="بحث بالاسم أو الباركود..." oninput="render()"><select id="filter" onchange="render()"><option value="">كل الأقسام</option></select><button onclick="seed(true)">إضافة مواد افتراضية</button><button onclick="exportCatalog()">تصدير الأصناف</button><button onclick="document.getElementById('importFile').click()">استيراد أصناف</button><input id="importFile" type="file" accept=".json" hidden onchange="importCatalog(this)"><button onclick="printBarcodes()">طباعة الباركودات</button><button class="danger" onclick="clearDemo()">حذف المواد الافتراضية</button></div><div class="scroll"><table><thead><tr><th>المادة</th><th>القسم</th><th>الباركود</th><th>الشراء</th><th>البيع</th><th>الرصيد</th><th>حد التنبيه</th><th>الوحدة</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const companyContext=(()=>{try{return JSON.parse(localStorage.getItem('almahasib_company_context')||'{}')}catch{return{}}})();
const companyScope=String(companyContext.id||companyContext.code||'unscoped').replace(/[^A-Za-z0-9_-]/g,'_');
const K='tenant:'+companyScope+':market_catalog_v1', BAL='tenant:'+companyScope+':market_opening_balance'; let editId=null;
topCompany.textContent=companyContext.name||'الماركت والمجمع';
topBalance.value=localStorage.getItem(BAL)??'0';
function saveBalance(){localStorage.setItem(BAL,String(Number(topBalance.value||0)))}
function tick(){const d=new Date();topTime.textContent=d.toLocaleTimeString('ar-IQ');topDate.textContent=d.toLocaleDateString('ar-IQ')} tick();setInterval(tick,1000);
document.querySelector('h1').textContent='مركز إدارة '+(companyContext.name||'الماركت والمجمع');
const groups={
'مواد غذائية':['رز بسمتي','رز عنبر','سكر','طحين','ملح','زيت طبخ','سمن','معجون طماطم','عدس','حمص','فاصوليا','شاي','قهوة','حليب','لبن','جبن','بيض','مكرونة','شعيرية','تونة','سردين','مخللات','عسل','مربى'],
'بهارات':['فلفل أسود','كمون','كركم','كاري','قرفة','هيل','قرنفل','سماق','بابريكا','زنجبيل','بهارات لحم','بهارات دجاج','بهارات برياني','ليمون دوزي'],
'مشروبات':['ماء معدني','كولا','برتقال غازي','ليمون غازي','عصير برتقال','عصير مانجو','عصير تفاح','مشروب طاقة'],
'حلويات وسناكات':['بسكويت','ويفر','شوكولاتة','جيبس','مكسرات','علكة','كيك','تمر'],
'منظفات ومنزلية':['مسحوق غسيل','سائل صحون','كلور','منظف أرضيات','منظف زجاج','مناديل','ورق صحي','أكياس نفايات','إسفنج','ممسحة','مكنسة','دلو','حافظة طعام','قدور','مقلاة','صحون','أكواب'],
'قرطاسية':['دفتر','قلم جاف','قلم رصاص','ممحاة','براية','مسطرة','ألوان','ملف','ورق A4','دباسة','لاصق','مقص','حقيبة مدرسية'],
'ألعاب':['كرة قدم','سيارة أطفال','دمية','مكعبات بناء','لعبة تعليمية','مسدس ماء','دراجة أطفال','بازل','كرة سلة','طائرة لعبة'],
'ملابس رجالية':['قميص رجالي','تيشيرت رجالي','بنطلون رجالي','جينز رجالي','بدلة رجالية','جاكيت رجالي','ملابس داخلية رجالية','جوارب رجالية'],
'ملابس نسائية':['بلوزة نسائية','فستان','عباءة','تنورة','بنطلون نسائي','جاكيت نسائي','ملابس داخلية نسائية','جوارب نسائية'],
'ملابس أطفال':['تيشيرت أطفال','بنطلون أطفال','فستان أطفال','بيجامة أطفال','جاكيت أطفال','ملابس مواليد','جوارب أطفال'],
'أحذية':['حذاء رجالي','حذاء نسائي','حذاء أطفال','حذاء رياضي','صندل رجالي','صندل نسائي','شبشب'],
'كهربائيات':['مصباح LED','سلك كهرباء','فيشة','مقبس','مشترك كهرباء','شاحن هاتف','كيبل USB','بطاريات','مروحة','غلاية كهربائية','مكواة','خلاط','سخان ماء','مصباح طوارئ'],
'عناية شخصية':['شامبو','صابون','معجون أسنان','فرشاة أسنان','مزيل عرق','كريم يد','شفرة حلاقة','حفاضات أطفال','مناديل مبللة'],
'معلبات وحبوب':['ذرة معلبة','بازلاء معلبة','فطر معلب','فول معلب','لوبيا','برغل','شوفان','سميد','نشا','خميرة','بيكنج باودر'],
'مجمدات':['دجاج مجمد','برغر مجمد','ناغتس','بطاطا مجمدة','خضار مشكلة مجمدة','سمك مجمد','آيس كريم عائلي'],
'ألبان وأجبان':['حليب كامل الدسم','حليب قليل الدسم','لبن عيران','قشطة','جبن مثلثات','جبن كريمي','جبن شرائح','زبدة'],
'مخبوزات':['خبز صمون','خبز عربي','توست أبيض','توست أسمر','كعك','كرواسون','كليجة'],
'أدوات مطبخ':['سكين مطبخ','لوح تقطيع','مصفاة','ملعقة طبخ','شوكة','سكين سفرة','صينية','ترمس','إبريق','علبة حفظ'],
'مفروشات':['بطانية','شرشف سرير','غطاء وسادة','منشفة','سجادة صغيرة','ستارة','مخدة'],
'إكسسوارات':['محفظة','حزام','نظارة شمسية','قبعة','ساعة يد','حقيبة نسائية','حقيبة ظهر','مظلة'],
'أطفال ومواليد':['رضاعة أطفال','لهاية','بودرة أطفال','شامبو أطفال','زيت أطفال','منشفة أطفال','بطانية أطفال'],
'سيارات':['معطر سيارة','مناديل سيارة','شاحن سيارة','حامل هاتف سيارة','سائل تنظيف زجاج','إسفنجة سيارة'],
'حدائق وعدة':['خرطوم ماء','مرش ماء','قفازات عمل','مطرقة','مفك','كماشة','شريط قياس','مصباح يدوي'],
'خضار وفواكه':['طماطم','خيار','بطاطا','بصل','ثوم','باذنجان','فلفل أخضر','ليمون','برتقال','تفاح','موز','عنب','رمان','تمر طازج'],
'لحوم ودواجن':['لحم غنم','لحم عجل','دجاج كامل','صدر دجاج','أفخاذ دجاج','كبدة','لحم مفروم'],
'عطور وتجميل':['عطر رجالي','عطر نسائي','كريم وجه','أحمر شفاه','مكياج عيون','طلاء أظافر','قطن تجميلي','مزيل مكياج'],
'هواتف وإلكترونيات':['سماعة سلكية','سماعة بلوتوث','باور بانك','ذاكرة USB','بطاقة ذاكرة','وصلة شحن Type-C','وصلة Lightning','حامل هاتف','شاحن سريع'],
'أجهزة منزلية':['ثلاجة','فريزر','غسالة','طباخ','فرن كهربائي','مايكروويف','مكنسة كهربائية','مبرد ماء','تلفاز'],
'رياضة ولياقة':['كرة قدم','كرة سلة','دمبل','حبل قفز','حصيرة رياضية','قفازات رياضية','قنينة رياضية'],
'مستلزمات سفر':['حقيبة سفر صغيرة','حقيبة سفر كبيرة','قفل حقيبة','وسادة سفر','ميزان حقائب','حافظة جواز'],
'مستلزمات حيوانات':['طعام قطط','طعام كلاب','رمل قطط','وعاء طعام','طوق حيوان','شامبو حيوانات'],
'موسمية وهدايا':['ورق تغليف','كيس هدية','شريط هدايا','شموع','زينة مناسبات','بطاقة تهنئة','فانوس','مسبحة'],
'أدوات صحية منزلية':['ميزان حرارة','كمامة','قفازات صحية','لاصق جروح','قطن طبي','معقم يدين','جهاز قياس ضغط منزلي'],
'بلاستيكيات':['سلة غسيل','سلة نفايات','علبة تخزين','كرسي بلاستيك','طاولة بلاستيك','قنينة ماء','حوض بلاستيك','مشجب ملابس'],
'أثاث خفيف':['كرسي مكتب','طاولة جانبية','رف أحذية','رف كتب','منظم ملابس','مرآة','علاقة ملابس'],
'مياه وعصائر بالجملة':['كارتون ماء صغير','كارتون ماء كبير','كارتون عصير برتقال','كارتون عصير مانجو','كارتون مشروب غازي','كارتون مشروب طاقة']
};
function load(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}} function put(x){localStorage.setItem(K,JSON.stringify(x));localStorage.setItem('tenant:'+companyScope+':market_catalog_updated_at',new Date().toISOString())}
function code(i){return '629'+String(1000000000+i).padStart(10,'0').slice(-10)}
function seed(force=false){let a=load();if(a.length&&!force)return render(); if(force&&a.length&&!confirm('إضافة مجموعة افتراضية جديدة؟'))return;let n=a.length+1;Object.entries(groups).forEach(([c,names],gi)=>names.forEach((base,j)=>{['اقتصادي','وسط','ممتاز','عائلي','عرض خاص','حجم صغير','حجم كبير','ماركة A','ماركة B','ماركة C'].forEach((v,k)=>{a.push({id:crypto.randomUUID(),name:base+' '+v,category:c,barcode:code(n++),cost:Math.max(100,Math.round((250+(gi*175)+(j*125)+(k*500))*.72)),price:250+(gi*175)+(j*125)+(k*500),qty:20+((j*17+k*11)%180),minQty:10,unit:/رز|سكر|طحين|ملح|بهارات|عدس|حمص|فاصوليا/.test(base)?'كغم':/حذاء|صندل|شبشب/.test(base)?'زوج':'قطعة',demo:true})})}));put(a);render()}
function save(){let a=load(),nm=name.value.trim(),c=cat.value.trim(),b=barcode.value.trim()||code(Date.now()%1000000000);if(!nm||!c||!price.value)return alert('أدخل الاسم والقسم وسعر البيع');if(a.some(x=>x.barcode===b&&x.id!==editId))return alert('الباركود مستخدم');let o={id:editId||crypto.randomUUID(),name:nm,category:c,barcode:b,cost:+cost.value||0,price:+price.value,qty:+qty.value||0,minQty:+minQty.value||0,unit:unit.value,demo:false};a=editId?a.map(x=>x.id===editId?{...x,...o}:x):[o,...a];put(a);clearForm();render()}
function edit(id){let x=load().find(x=>x.id===id);if(!x)return;editId=id;name.value=x.name;cat.value=x.category;barcode.value=x.barcode;cost.value=x.cost||0;price.value=x.price;qty.value=x.qty;minQty.value=x.minQty??5;unit.value=x.unit;scrollTo({top:0,behavior:'smooth'})}
function del(id){if(!confirm('حذف المادة؟'))return;put(load().filter(x=>x.id!==id));render()} function clearDemo(){if(confirm('حذف جميع المواد الافتراضية فقط؟')){put(load().filter(x=>!x.demo));render()}}
function exportCatalog(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='market-catalog-'+companyScope+'.json';a.click();URL.revokeObjectURL(a.href)}
function importCatalog(input){const file=input.files&&input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!Array.isArray(incoming))throw 0;const current=load(),byCode=new Map(current.map(x=>[String(x.barcode),x]));incoming.forEach(x=>{if(!x.name||!x.barcode)return;byCode.set(String(x.barcode),{id:x.id||crypto.randomUUID(),name:String(x.name),category:String(x.category||'غير مصنف'),barcode:String(x.barcode),cost:+x.cost||0,price:+x.price||0,qty:+x.qty||0,minQty:+x.minQty||5,unit:String(x.unit||'قطعة'),demo:false})});put([...byCode.values()]);render();alert('تم استيراد الأصناف') }catch{alert('ملف الأصناف غير صالح')}input.value=''};r.readAsText(file)}
function printBarcodes(){const a=load();if(!a.length)return alert('لا توجد أصناف');const w=open('','_blank');w.document.write('<html dir="rtl"><head><title>باركودات الأصناف</title><style>body{font-family:Arial;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.x{border:1px solid #000;padding:8px;text-align:center;break-inside:avoid}.code{font-family:monospace;font-size:18px;letter-spacing:2px}</style></head><body>'+a.map(x=>'<div class="x"><b>'+x.name+'</b><div class="code">'+x.barcode+'</div><div>'+Number(x.price||0).toLocaleString('ar-IQ')+' د.ع</div></div>').join('')+'</body></html>');w.document.close();w.print()}
function clearForm(){editId=null;name.value=cat.value=barcode.value=cost.value=price.value=qty.value='';minQty.value='5'}
function chooseCategory(c){filter.value=c;render()} function render(){let a=load(),cats=[...new Set(a.map(x=>x.category))].sort(),old=filter.value;filter.innerHTML='<option value="">كل الأقسام</option>'+cats.map(c=>'<option>'+c+'</option>').join('');filter.value=old;categoryCards.innerHTML='<button onclick="chooseCategory(\'\')">كل الأصناف<br><b>'+a.length+'</b></button>'+cats.map(c=>'<button onclick="chooseCategory(\''+c.replace(/'/g,"\\'")+'\')">'+c+'<br><b>'+a.filter(x=>x.category===c).length+'</b></button>').join('');let z=q.value.trim();let f=a.filter(x=>(!old||x.category===old)&&(!z||x.name.includes(z)||x.barcode.includes(z)));rows.innerHTML=f.map(x=>'<tr><td>'+x.name+'</td><td>'+x.category+'</td><td>'+x.barcode+'</td><td>'+x.price.toLocaleString('ar-IQ')+' د.ع</td><td>'+x.qty+'</td><td>'+x.unit+'</td><td><button onclick="edit(\''+x.id+'\')">تعديل</button> <button class="danger" onclick="del(\''+x.id+'\')">حذف</button></td></tr>').join('');sCount.textContent=a.length;sCats.textContent=cats.length;sStock.textContent=a.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString('ar-IQ')+' د.ع';sLow.textContent=a.filter(x=>Number(x.qty)<=Number(x.minQty??5)).length}
if(!load().length)seed();render();
</script></body></html>
