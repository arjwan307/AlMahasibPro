<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الموردون — المحاسب برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172438;font-family:Cairo,Tahoma,sans-serif}.wrap{max-width:1280px;margin:auto;padding:22px}.head,.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head h1{margin:0;color:#174d45}.subtle{color:#718096;font-size:.88rem}.card{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 22px #18334b0a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:15px}.stat b{display:block;font-size:1.25rem;color:#174d45}.btn{border:0;border-radius:10px;background:#174d45;color:#fff;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.alt{background:#e9eff3;color:#243449}.btn.warn{background:#a33b3b}.btn.sm{padding:6px 9px;font-size:.82rem}.search{min-width:260px;border:1px solid #cfd8e4;border-radius:10px;padding:10px 12px;font:inherit}.supplier{border:1px solid #dfe6ef;border-radius:16px;margin:12px 0;overflow:hidden}.supplier-head{padding:14px 16px;background:#f8fafc;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.supplier-head h3{margin:0}.summary{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}.summary strong{color:#174d45}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:right;padding:10px;border-top:1px solid #e6ebf1;font-size:.9rem}th{background:#fbfcfd}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf4f1;color:#174d45;font-weight:700}.modal{position:fixed;inset:0;background:#10203088;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{background:#fff;border-radius:18px;padding:18px;width:min(620px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-size:.85rem;font-weight:700;color:#536178}.field input,.field select{border:1px solid #cfd8e4;border-radius:9px;padding:9px;font:inherit}.empty{text-align:center;padding:30px;color:#718096}@media(max-width:760px){.wrap{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{min-width:100%}}
</style>
<link rel="stylesheet" href="/app-ui.css?v=1.2.0"></head>
<body>
<main class="wrap">
<header class="head"><div><h1>إدارة الموردين</h1><div class="subtle">حساب المورد، الفواتير، سندات الدفع، الحوالات والصكوك — بيانات تطوير قابلة للتعديل والحذف</div></div><div class="actions"><button class="btn alt" onclick="location.href='/dashboard.html'">الرئيسية</button><button class="btn" id="addSupplier">+ مورد جديد</button></div></header>
<section class="stats"><div class="stat"><span>الموردون</span><b id="supplierCount">0</b></div><div class="stat"><span>إجمالي الفواتير</span><b id="invoiceTotal">0</b></div><div class="stat"><span>المدفوع</span><b id="paidTotal">0</b></div><div class="stat"><span>المتبقي</span><b id="balanceTotal">0</b></div></section>
<section class="card"><div class="toolbar"><h2 style="margin:0">حسابات الموردين</h2><input id="search" class="search" placeholder="بحث باسم المورد أو الهاتف أو رقم الفاتورة"></div><div id="suppliers"></div></section>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="head"><h2 id="modalTitle">تعديل</h2><button class="btn alt" id="closeModal">إغلاق</button></div><div id="formBody"></div></div></div>
<script src="/suppliers-ui.js" defer></script>
<script src="/app-ui.js?v=1.2.0" defer></script></body></html>
