<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المطاعم والمجمعات | لوحة التحكم - المحاسب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .main-card {
            width: 100%; max-width: 1200px;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            border-radius: 40px; padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center; animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(50px); } to { opacity:1; transform:translateY(0); } }
        .header h1 { color: #fff; font-size: 2.8rem; margin-bottom: 10px; }
        .header h1 span { color: #fbbf24; }

        /* ---- الأقسام الرئيسية (3 أقسام) ---- */
        .grid-main {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin: 40px 0;
        }
        .main-icon-card {
            background: rgba(255,255,255,0.08); padding: 40px 20px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05); color: #fff; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .main-icon-card:hover { transform: translateY(-15px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .main-icon-card i { font-size: 5rem; transition: 0.6s; }
        .main-icon-card:hover i { transform: rotateY(180deg) scale(1.2); }
        .main-icon-card h3 { font-size: 1.8rem; font-weight: 700; }
        .main-icon-card p { font-size: 0.9rem; opacity: 0.7; }
        .card-restaurant i { color: #f97316; }
        .card-market i { color: #22d3ee; }
        .card-company i { color: #a78bfa; }

        /* ---- الأقسام الفرعية (الأدوات المشتركة) ---- */
        .grid-sub {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 20px; 
            margin-top: 30px;
        }
        .sub-icon-card {
            background: rgba(255,255,255,0.05); padding: 25px 15px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05); color: #fff; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .sub-icon-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.15); border-color: #fbbf24; }
        .sub-icon-card i { font-size: 2.5rem; color: #fbbf24; transition: 0.4s; }
        .sub-icon-card:hover i { transform: scale(1.3) rotate(5deg); }
        .sub-icon-card h4 { font-size: 1.1rem; font-weight: 600; }
        .sub-icon-card p { font-size: 0.8rem; opacity: 0.6; }

        @media (max-width: 900px) {
            .grid-main { grid-template-columns: 1fr; }
        }
    </style>
<link rel="stylesheet" href="/app-ui.css?v=1.2.0"></head>
<body>
    <div class="main-card">
        <div class="header">
            <h1>🌙 المحاسب <span>برو</span></h1>
            <p style="color:rgba(255,255,255,0.7);">اختر القسم الذي تريد العمل عليه</p>
        </div>

        <!-- الأقسام الرئيسية (أنظمة العمل) -->
        <div class="grid-main">
            <div class="main-icon-card card-restaurant" onclick="window.location.href='/pos.html?mode=restaurant'">
                <i class="fas fa-utensils"></i>
                <h3>مطاعم وكافيهات</h3>
                <p>نقاط البيع، الطلبات، جدول المطعم</p>
            </div>
            <div class="main-icon-card card-market" onclick="window.location.href='/market-cashier.html?mode=market'">
                <i class="fas fa-store"></i>
                <h3>ماركتات ومجمعات</h3>
                <p>إدارة المبيعات، الأقسام، العروض</p>
            </div>

        </div>

        <!-- الأقسام الفرعية (الأدوات المشتركة) - تم تحديث الروابط -->
        <p>المحاسب برو للمطاعم والمجمعات</p><button id="retailLogout" style="padding:12px">تسجيل الخروج وتبديل الحساب</button>
    </div><script>
fetch('/api/v1/bootstrap',{credentials:'same-origin'}).then(response=>{if(!response.ok)location.replace('/retail-login.html');});
document.getElementById('retailLogout').onclick=async()=>{const response=await fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'});if(response.ok||response.status===401)location.replace('/retail-login.html');else alert('تعذر تسجيل الخروج؛ أعد المحاولة');};
</script><script src="/app-ui.js?v=1.2.0" defer></script></body></html>
