<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء — المحاسب برو</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18263a;font-family:Cairo,Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{margin:0;color:#174d45}.card{background:white;border:1px solid #dfe6ef;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 20px #18334b0a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:.9rem;font-weight:700;color:#536178}.field input,.field textarea{border:1px solid #cfd8e4;border-radius:10px;padding:10px 12px;font:inherit}.field textarea{min-height:70px}.btn{border:0;border-radius:10px;background:#174d45;color:white;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.alt{background:#eaf0f3;color:#243449}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:right;padding:10px;border-bottom:1px solid #e0e6ed}.table{overflow:auto}.subtle{color:#718096;font-size:.86rem}@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style><link rel="stylesheet" href="/company-responsive.css?v=20261010-mobile"></head><body><main class="wrap"><header class="head"><div><h1>إدارة العملاء</h1><div class="subtle">بيانات العميل المسجلة تظهر تلقائيًا في فواتير الجملة والمفرد</div></div><button class="btn alt" onclick="location.href='/wholesale-sales.html'">العودة للمبيعات</button></header>
<section id="createCard" class="card"><h2>إضافة عميل</h2><div class="grid"><div class="field"><label>اسم العميل</label><input id="name" required></div><div class="field"><label>رمز العميل</label><input id="code" placeholder="يُنشأ تلقائيًا إذا تركته فارغًا"></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel"></div><div class="field"><label>المحافظة</label><input id="province"></div><div class="field"><label>القضاء / المنطقة</label><input id="district"></div><div class="field"><label>حد الائتمان</label><input id="credit" type="number" min="0" value="0"></div><div class="field" style="grid-column:1/-1"><label>العنوان التفصيلي</label><textarea id="address"></textarea></div></div><div style="margin-top:12px"><button class="btn" id="save">حفظ العميل</button></div></section>
<section class="card"><h2>العملاء المسجلون</h2><div class="table"><table><thead><tr><th>الاسم</th><th>الرمز</th><th>الهاتف</th><th>المحافظة</th><th>القضاء / المنطقة</th><th>حد الائتمان</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/customers-ui.js" defer></script></body></html>
