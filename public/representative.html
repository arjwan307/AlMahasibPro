<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>المندوب المتحرك - المحاسب برو</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
*{box-sizing:border-box;font-family:Cairo,sans-serif}body{margin:0;min-height:100vh;padding:12px;color:#fff;background:linear-gradient(135deg,#0f172a,#1e293b)}.shell{max-width:760px;margin:auto}.top,.card,.tabs{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:15px;margin-bottom:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:1.25rem;margin:0}.accent{color:#fbbf24}.badge{padding:5px 10px;border-radius:14px;background:#475569;font-size:.75rem}.online{background:#166534}.offline{background:#991b1b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:rgba(255,255,255,.06);border-radius:15px;padding:10px}.stat strong{display:block;color:#fbbf24}.tabs{display:flex;overflow:auto;padding:8px}.tabs button,.btn{border:0;border-radius:11px;padding:10px 13px;color:#fff;background:#475569;white-space:nowrap}.tabs button.active,.primary{background:#2563eb}.success{background:#16a34a}.warning{background:#d97706}.danger{background:#dc2626}.view{display:none}.view.active{display:block}.field{display:grid;gap:5px;margin:10px 0}input,select{width:100%;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:10px;padding:11px}.list{display:grid;gap:8px}.row{background:rgba(255,255,255,.05);border-radius:13px;padding:11px;display:flex;justify-content:space-between;gap:8px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{opacity:.65;font-size:.82rem}.conflict{border-right:4px solid #ef4444}.pending{border-right:4px solid #f59e0b}@media(min-width:700px){body{padding:24px}.top h1{font-size:1.65rem}}</style></head><body><main class="shell">
<section class="top"><div><h1><i class="fas fa-truck"></i> المندوب <span class="accent" id="repName"></span></h1><div class="muted" id="routeName">جارٍ التحميل...</div></div><div><span id="network" class="badge"></span> <button class="btn" id="switchAccount">تسجيل الخروج وتبديل الحساب</button></div></section>
<section class="card stats"><div class="stat"><strong id="stockCount">0</strong>مواد السيارة</div><div class="stat"><strong id="custody">0</strong>عهدة نقد</div><div class="stat"><strong id="pendingCount">0</strong>معلّق</div></section>
<nav class="tabs"><button data-view="route" class="active">المسار</button><button data-view="sale">بيع/طلب</button><button data-view="collect">تحصيل</button><button data-view="handover">تسليم</button><button data-view="sync">المزامنة</button></nav>
<section id="route" class="card view active"><h3>عملاء اليوم</h3><div id="customers" class="list"></div></section>
<section id="sale" class="card view"><div class="field"><label>العميل</label><select id="saleCustomer"></select></div><div class="field"><label>باركود / رمز المادة</label><input id="barcode" autocomplete="off"><button class="btn primary" id="addItem">إضافة</button></div><div id="cart" class="list"></div><div class="field"><label>الخصم</label><input id="discount" value="0"></div><div class="field"><label>النقد المستلم (والباقي آجل)</label><input id="cash" value="0"></div><div class="actions"><button class="btn success" id="saveSale">اعتماد البيع</button><button class="btn warning" id="saveOrder">حفظ طلب فقط</button><button class="btn danger" id="returnLast">إرجاع آخر فاتورة متزامنة</button></div></section>
<section id="collect" class="card view"><div class="field"><label>العميل</label><select id="collectCustomer"></select></div><div class="field"><label>المبلغ</label><input id="collectionAmount"></div><button class="btn success" id="saveCollection">تسجيل التحصيل</button></section>
<section id="handover" class="card view"><p>يسجل التسليم كمسودة بانتظار مزامنة ومراجعة المشرف. اعتماد المشرف هو الذي ينقل النقد والبضاعة فعليًا.</p><div class="field"><label>مخزن الاستلام</label><select id="handoverWarehouse"></select></div><div class="field"><label>النقد المسلم</label><input id="handoverCash"></div><label><input id="handoverAllStock" type="checkbox" style="width:auto"> تسليم كامل بضاعة السيارة المتبقية</label><button class="btn warning" id="submitHandover">إرسال التسليم للمراجعة</button></section>
<section id="sync" class="card view"><div class="actions"><button class="btn primary" id="syncNow">مزامنة الآن</button></div><h3>عمليات معلقة</h3><div id="pending" class="list"></div><h3>تعارضات / رفض</h3><div id="conflicts" class="list"></div></section>
</main><script src="/offline-sync.js" defer></script><script src="/representative-ui.js" defer></script></body></html>
