<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة مطور المحاسب كاشير برو</title><style>body{font-family:Tahoma;background:#192339;color:white;padding:25px}section{background:#303d55;border-radius:14px;padding:20px;margin:15px auto;max-width:900px}input,button{padding:12px;margin:5px;border-radius:8px;border:0}button{background:#ffdb74;cursor:pointer}.entry{padding:12px;border-bottom:1px solid #677;display:flex;justify-content:space-between;gap:12px}</style></head><body><h1>المحاسب كاشير برو — لوحة المطور</h1><section id="signin"><form id="login"><input id="user" placeholder="اسم المطور" required><input id="pass" type="password" placeholder="كلمة المرور" required><button>دخول</button></form></section><div id="panel" hidden><section><h2>طلبات المطاعم والمجمعات</h2><div id="pending"></div></section><section><h2>الحسابات المعتمدة</h2><div id="accounts"></div></section><button id="reload">تحديث</button></div><p id="message" role="status"></p><script>
const el=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,opt={}){const r=await fetch('/api/v1/'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||'فشل الطلب');return d}
async function reload(){try{const [p,a]=await Promise.all([api('platform/companies/pending'),api('platform/companies')]);const only=x=>x.companies.filter(c=>c.product==='retail');el('pending').innerHTML=only(p).map(c=>'<div class="entry">'+safe(c.legalName)+' <button data-approve="'+safe(c.id)+'">اعتماد</button></div>').join('')||'لا توجد طلبات';el('accounts').innerHTML=only(a).map(c=>'<div class="entry">'+safe(c.legalName)+' — '+safe(c.code)+' — '+safe(c.status)+' <button data-id="'+safe(c.id)+'" data-status="'+(c.status==='active'?'suspended':'active')+'">'+(c.status==='active'?'إيقاف':'تفعيل')+'</button></div>').join('')||'لا توجد حسابات'}catch(e){el('message').textContent=e.message}}
el('login').onsubmit=async e=>{e.preventDefault();try{let deviceId=localStorage.getItem('cashier_dev_device');if(!deviceId){deviceId=crypto.randomUUID();localStorage.setItem('cashier_dev_device',deviceId)}await api('auth/login',{method:'POST',body:JSON.stringify({platform:true,username:el('user').value,password:el('pass').value,deviceId})});el('signin').hidden=true;el('panel').hidden=false;await reload()}catch(err){el('message').textContent=err.message}};
el('reload').onclick=reload;
el('panel').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.approve){const code=prompt('رمز المطعم أو المجمع');if(!code)return;await api('platform/companies/'+encodeURIComponent(b.dataset.approve)+'/approve',{method:'POST',body:JSON.stringify({code})})}else if(b.dataset.id){if(!confirm('تأكيد تغيير الحالة؟'))return;await api('platform/companies/'+encodeURIComponent(b.dataset.id)+'/status',{method:'POST',body:JSON.stringify({status:b.dataset.status})})}await reload()}catch(err){el('message').textContent=err.message}};
</script></body></html>
