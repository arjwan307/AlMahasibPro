<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - المحاسب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.8s ease;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title {
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .panel-title i { color: #ffeb3b; }

        /* ---- الإشعارات ---- */
        .notifications-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .notifications-list::-webkit-scrollbar { width: 6px; }
        .notifications-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .notifications-list::-webkit-scrollbar-thumb { background: #ffeb3b; border-radius: 10px; }

        .notif-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            color: #fff;
            border-right: 4px solid #ffeb3b;
            transition: 0.3s;
        }
        .notif-item:hover { background: rgba(255, 255, 255, 0.2); transform: translateX(-5px); }
        .notif-item h4 { font-size: 1.1rem; margin-bottom: 5px; }
        .notif-item p { font-size: 0.95rem; opacity: 0.8; }
        .notif-item .time { font-size: 0.85rem; opacity: 0.6; display: block; margin-top: 5px; text-align: left; }

        /* ---- تسجيل الدخول ---- */
        .login-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: slideUp 0.8s ease-out;
        }
        .logo-icon {
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            animation: pulse 2s infinite;
            margin-bottom: 15px;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .brand-title {
            color: #fff;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 30px;
        }
        .brand-title span { color: #ffeb3b; }

        .input-group {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin-bottom: 18px;
        }
        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
        }
        .input-group input {
            width: 100%;
            padding: 14px 50px 14px 15px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            transition: 0.3s;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.6); }
        .input-group input:focus { background: rgba(255, 255, 255, 0.4); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        
        .login-btn {
            width: 100%;
            max-width: 320px;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: #ffeb3b;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255, 235, 59, 0.4); }

        /* ---- الفيديو والقنوات ---- */
        .video-wrapper {
            flex: 1;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            display: flex;
            flex-direction: column;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .video-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 0 0 0;
            justify-content: center;
            background: transparent;
            position: relative;
        }
        .open-menu-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: #ffeb3b;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(255, 235, 59, 0.3);
        }
        .open-menu-btn:hover { transform: scale(1.05); }

        /* القائمة الجانبية */
        .channel-menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: flex-end;
        }
        .channel-menu {
            width: 350px;
            height: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border-left: 3px solid #ffeb3b;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .menu-header button {
            background: transparent; border: none; color: #ffeb3b; font-size: 1.5rem; cursor: pointer;
        }

        .file-input-wrapper { display: inline-block; position: relative; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .size-controls { display: flex; gap: 5px; }
        .size-controls button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; padding: 2px 8px; color: #fff; cursor: pointer; font-size: 1rem; }

        @media (max-width: 1000px) {
            .main-dashboard { grid-template-columns: 1fr; height: auto; gap: 15px; }
            .glass-panel { min-height: 250px; }
            .channel-menu { width: 80%; }
        }
    </style>
</head>
<body>

    <div class="main-dashboard">
        <!-- 1. العمود الأيسر: الإشعارات -->
        <div class="glass-panel">
            <div class="panel-title"><i class="fas fa-bell"></i> إشعارات</div>
            <div class="notifications-list">
                <div class="notif-item">
                    <h4>📢 تذكير هام</h4>
                    <p>موعد اجتماع مجلس الإدارة غداً الساعة 10 صباحاً.</p>
                    <span class="time">منذ ساعة</span>
                </div>
                <div class="notif-item">
                    <h4>💬 رسالة جديدة</h4>
                    <p>تم استلام طلب ترقية نظام المحاسبة.</p>
                    <span class="time">منذ 3 ساعات</span>
                </div>
                <div class="notif-item">
                    <h4>📊 تقرير شهري</h4>
                    <p>تقرير المبيعات لشهر يناير جاهز.</p>
                    <span class="time">منذ يوم</span>
                </div>
            </div>
        </div>

        <!-- 2. العمود الأوسط: تسجيل الدخول -->
        <div class="glass-panel">
            <div class="login-card">
                <div class="logo-icon"><i class="fas fa-calculator"></i></div>
                <div class="brand-title">المحاسب <span>برو</span></div>
                <form id="loginForm" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <div class="input-group">
                        <i class="fas fa-building"></i>
                        <input type="text" id="companyCode" placeholder="رمز الشركة" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="اسم المستخدم" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="كلمة المرور" required>
                    </div>
                    <button type="submit" class="login-btn">دخول</button>
                </form>
            </div>
        </div>

        <!-- 3. العمود الأيمن: الفيديو -->
        <div class="glass-panel">
            <div class="panel-title"><i class="fas fa-tv"></i> بث مباشر</div>
            <div class="video-wrapper" id="videoWrapper">
                <video id="mainVideoPlayer" controls playsinline></video>
            </div>
            <div class="video-controls">
                <button class="open-menu-btn" onclick="openChannelMenu()"><i class="fas fa-list-ul"></i> القنوات</button>
                <div class="file-input-wrapper">
                    <button style="background:rgba(255,255,255,0.2); border:none; border-radius:20px; padding:8px 14px; color:#fff; cursor:pointer;"><i class="fas fa-folder-open"></i> ملف</button>
                    <input type="file" id="fileInput" accept="video/*" onchange="loadLocalVideo(event)">
                </div>
                <div class="size-controls">
                    <button onclick="toggleSize('max')"><i class="fas fa-expand"></i></button>
                    <button onclick="toggleSize('min')"><i class="fas fa-compress"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية للقنوات -->
    <div class="channel-menu-overlay" id="channelMenuOverlay" onclick="closeChannelMenu(event)">
        <div class="channel-menu" id="channelMenu">
            <div class="menu-header">
                <span>📺 قائمة القنوات</span>
                <button onclick="closeChannelMenuDirect()"><i class="fas fa-times"></i></button>
            </div>
            <div id="channelListContainer"></div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('mainVideoPlayer');
        let hlsInstance = null;

        const allChannels = {
            "📖 القرآن والدين": {
                'القرآن الكريم': 'https://ktvlive.online/stream/hls/ch1.m3u8',
                'كربلاء وثائقي': 'https://ktvlive.online/stream/hls/ch3.m3u8'
            },
            "📰 الأخبار": {
                'العراقية نيوز': 'https://imn-live.esite-lab.com/hls/iraqia-news.m3u8',
                'الجزيرة': 'https://live-hls-apps-aja-fa.getaj.net/AJA/01.m3u8'
            },
            "📺 تلفزيون": {
                'الشرقية': 'http://185.9.2.18/chid_144/index.m3u8',
                'MBC العراق': 'https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8'
            }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const company = document.getElementById('companyCode').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(company === 'argwan' && user === 'admin' && pass === '123456') {
                window.location.href = '/dashboard.html'; // الانتقال للصفحة الجديدة
            } else {
                alert('بيانات الدخول غير صحيحة.');
            }
        });

        function openChannelMenu() {
            const container = document.getElementById('channelListContainer');
            let html = '';
            for (const [group, channels] of Object.entries(allChannels)) {
                html += `<div style="color:#ffeb3b; margin:10px 0 5px 0;">${group}</div>`;
                for (const [name, url] of Object.entries(channels)) {
                    html += `<div class="channel-item" onclick="playChannel('${url}')" style="padding:8px 15px; color:#fff; cursor:pointer; border-radius:10px; transition:0.2s;">${name}</div>`;
                }
            }
            container.innerHTML = html;
            document.getElementById('channelMenuOverlay').style.display = 'flex';
        }

        function closeChannelMenu(event) {
            if(event.target === document.getElementById('channelMenuOverlay')) {
                document.getElementById('channelMenuOverlay').style.display = 'none';
            }
        }
        function closeChannelMenuDirect() {
            document.getElementById('channelMenuOverlay').style.display = 'none';
        }
        function playChannel(url) {
            document.getElementById('channelMenuOverlay').style.display = 'none';
            if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = url;
            } else if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoPlayer);
            }
            videoPlayer.play().catch(() => {});
        }
        function loadLocalVideo(event) {
            const file = event.target.files[0];
            if (file) {
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.load();
                videoPlayer.play();
            }
        }
        function toggleSize(size) {
            const panel = document.getElementById('videoWrapper');
            if(size === 'max') {
                panel.style.position = 'fixed'; panel.style.top = '0'; panel.style.left = '0';
                panel.style.width = '100vw'; panel.style.height = 'calc(100vh - 60px)';
                panel.style.zIndex = '999'; panel.style.borderRadius = '0';
            } else {
                panel.style.position = 'relative'; panel.style.width = '100%'; panel.style.height = '100%';
                panel.style.zIndex = '0'; panel.style.borderRadius = '15px';
            }
        }
    </script>
</body>
</html>
