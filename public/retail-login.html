<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحاسب برو | المطاعم والمجمعات</title><link rel="stylesheet" href="/enterprise.css"><script src="/retail-login.js" defer></script></head><body><a href="#" onclick="window.location.assign(window.location.origin);return false" style="position:fixed;top:16px;right:16px;z-index:10;padding:10px 16px;border-radius:12px;background:#fff;color:#173447;text-decoration:none;font-weight:700;box-shadow:0 8px 24px #102b3c33">↩ اختيار التطبيق</a><div id="notice" role="status" hidden></div><section class="entry"><div class="entry-card"><div class="brand">المحاسب <b>برو</b></div><p>المطاعم والمجمعات</p><h1 id="title">تسجيل الدخول</h1><p id="clock" class="muted"></p><form id="login"><label>رمز المنشأة<input name="companyCode" required></label><label>اسم المستخدم<input name="username" required autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button>دخول</button></form><p style="text-align:center;margin:12px 0"><a href="/register.html" style="color:#116f68;font-weight:700;text-decoration:none">إنشاء حساب مطعم أو مجمع / طلب اعتماد</a></p><form id="setup" hidden><label>اسم المطعم أو المجمع<input name="legalName" required></label><label>اسم المدير<input name="ownerName" required></label><label>اسم المستخدم<input name="username" required autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><button>إنشاء المنشأة</button></form></div></section></body></html>
