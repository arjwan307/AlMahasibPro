<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>قارئ باركود AlMahasibPro</title><style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Arial;text-align:center}.wrap{max-width:600px;margin:auto;padding:20px}video{width:100%;border-radius:20px;background:#000;max-height:58vh}.card{background:#10213a;border:1px solid #29415f;border-radius:18px;padding:16px;margin:14px 0}input,button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #405a7c;background:#0b1a2e;color:#fff;font-size:18px}button{background:#6d45ff;font-weight:bold}.ok{color:#53e39a}.bad{color:#ff7189}</style></head><body><div class="wrap"><h2>قارئ باركود AlMahasibPro</h2><div class="card"><input id="token" placeholder="رمز الربط من شاشة الكاشير"><button onclick="start()">تشغيل الكاميرا</button><div id="status">أدخل رمز الربط</div></div><video id="v" playsinline></video><div class="card"><input id="manual" inputmode="numeric" placeholder="إدخال باركود يدوي"><button onclick="send(manual.value)">إرسال</button></div></div><script>
let detector,last='',lastAt=0,running=false;
async function start(){const t=token.value.trim();if(!t)return status.textContent='أدخل رمز الربط';try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});v.srcObject=stream;await v.play();if(!('BarcodeDetector'in window))throw new Error('هذا المتصفح لا يدعم قارئ الباركود المدمج');detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});running=true;status.className='ok';status.textContent='جاهز للمسح';scan()}catch(e){status.className='bad';status.textContent=e.message}}
async function scan(){if(!running)return;try{const a=await detector.detect(v);if(a[0]){const code=a[0].rawValue,now=Date.now();if(code!==last||now-lastAt>1800){last=code;lastAt=now;await send(code)}}}catch{}requestAnimationFrame(scan)}
async function send(code){code=String(code||'').trim();const t=token.value.trim();if(!code||!t)return;try{const r=await fetch('/api/v1/market/scanner/'+encodeURIComponent(t)+'/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({barcode:code})});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b?.error?.message||'فشل الإرسال');status.className='ok';status.textContent='تم إرسال: '+code;manual.value='';navigator.vibrate?.(80)}catch(e){status.className='bad';status.textContent=e.message}}</script></body></html>
