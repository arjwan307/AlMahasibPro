<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>إنشاء حساب | المحاسب برو</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#091522,#0d2031 60%,#101a28);font-family:Cairo,Tahoma,sans-serif;color:#e9f1f6;display:grid;place-items:center;padding:22px}.card{width:min(100%,560px);padding:30px;border:1px solid #ffffff20;border-radius:24px;background:#13283a;box-shadow:0 20px 60px #0004}.brand{text-align:center;font-size:1.8rem;font-weight:800}.brand b{color:#f3c969}.sub{text-align:center;color:#a9bac8;margin:7px 0 22px}.back{display:block;text-align:center;color:#f3c969;text-decoration:none;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;margin:0 0 13px}label.full{grid-column:1/-1}input,textarea{display:block;width:100%;margin-top:6px;border:1px solid #ffffff28;border-radius:11px;padding:12px;background:#0b1b2a;color:white;font:inherit}textarea{min-height:78px;resize:vertical}button{width:100%;border:0;border-radius:12px;background:#f3c969;color:#152538;padding:13px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65}#notice{margin-top:14px;padding:12px;border-radius:11px;background:#ffffff12;line-height:1.8}#notice[hidden]{display:none}.note{color:#a9bac8;font-size:.87rem;line-height:1.7;margin-top:14px}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:22px}}
</style></head><body><main class="card"><div class="brand">المحاسب <b>برو</b></div><p id="productName" class="sub">إنشاء حساب</p><a class="back" href="#" onclick="location.assign(location.origin);return false">↩ العودة لاختيار التطبيق</a><form id="registration"><div class="grid"><label class="full">اسم المنشأة<input name="legalName" required maxlength="120" autocomplete="organization"></label><label>اسم المدير أو المسؤول<input name="ownerName" required maxlength="120" autocomplete="name"></label><label>رقم الهاتف<input name="phone" type="tel" required maxlength="32" autocomplete="tel"></label><label class="full">المحافظة / العنوان<textarea name="address" maxlength="240"></textarea></label><label>اسم المستخدم<input name="username" required maxlength="64" autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required minlength="10" autocomplete="new-password"></label></div><button id="submit">إرسال طلب إنشاء الحساب</button></form><div id="notice" role="status" hidden></div><p class="note">سيُرسل الطلب إلى إدارة المحاسب برو للمراجعة. لن يتم تفعيل الحساب إلا بعد اعتماد المطور وإصدار رمز المنشأة.</p></main><script>
const form=document.getElementById('registration'),notice=document.getElementById('notice'),submit=document.getElementById('submit');
const isRetail=location.pathname.startsWith('/retail/');document.getElementById('productName').textContent=isRetail?'إنشاء حساب مطعم أو مجمع':'إنشاء حساب شركة';
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;notice.hidden=true;try{const data=Object.fromEntries(new FormData(form));data.timezone='Asia/Baghdad';data.currency='IQD';const r=await fetch('/api/v1/companies/register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json().catch(()=>({}));if(!r.ok)throw Error(result.error?.message||'تعذر إرسال الطلب');form.reset();notice.textContent='تم استلام طلب '+(isRetail?'المطعم أو المجمع':'الشركة')+' بنجاح، وهو بانتظار مراجعة المطور واعتماده.';notice.hidden=false;}catch(err){notice.textContent=err.message;notice.hidden=false;}finally{submit.disabled=false;}});
</script></body></html>
