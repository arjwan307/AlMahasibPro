<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربط الشركة بالسحابة</title>
<style>body{font:15px "Segoe UI",Arial;background:#eef5f7;color:#163344;margin:0}main{max-width:460px;margin:32px auto;padding:28px;background:white;border-radius:18px}label{display:block;margin:18px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:8px;font:inherit}input[type=checkbox]{display:inline;width:auto}button,a{padding:12px;font:inherit}button{background:#146d67;color:white;border:0;border-radius:9px}#message{white-space:pre-wrap}</style><link rel="stylesheet" href="/app-ui.css?v=1.2.0">
<main><header style="display:flex;align-items:center;justify-content:space-between"><h1 style="font-size:23px">ربط السحابة</h1><details><summary title="معلومات الربط" style="cursor:pointer">ⓘ</summary><p>أدخل حساب المدير. تُحفظ نسخة احتياطية قبل اعتماد بيانات الشركة السحابية على الجهاز.</p></details></header>
<form id="form"><label>عنوان الخادم<input id="url" type="url" value="https://shenoo-menoo-tak-tak.onrender.com" required></label><label>رمز الشركة<input id="company" required></label><label>اسم المستخدم<input id="username" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><label><input id="adopt" type="checkbox" required> اعتماد بيانات السحابة بدل بيانات هذا الجهاز، مع حفظ نسخة احتياطية</label><button id="submit">ربط الشركة</button> <a href="/index.html">رجوع</a></form><p id="message" role="status"></p></main>
<script>document.getElementById('form').onsubmit=async event=>{event.preventDefault();const $=id=>document.getElementById(id);$('submit').disabled=true;$('message').textContent='جاري الربط وتنزيل بيانات الشركة…';try{const response=await fetch('/api/local/cloud/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value,companyCode:$('company').value,username:$('username').value,password:$('password').value,adopt:$('adopt').checked})});const result=await response.json();if(!response.ok)throw Error(result.error?.message||'تعذر الربط');$('password').value='';$('message').textContent='اكتمل الربط. سجّل الدخول بحساب الشركة السحابية ورمزها: '+result.companyCode;setTimeout(()=>location.href='/enterprise.html',2500);}catch(error){$('message').textContent=error.message;}finally{$('submit').disabled=false;}};</script></html>
<script src="/app-ui.js?v=1.2.0" defer></script>
