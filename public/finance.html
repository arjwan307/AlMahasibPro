<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإدارة المالية - المحاسب برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            width: 100%; max-width: 1400px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
            flex-wrap: wrap; gap: 15px;
        }
        .header h2 { color: #fbbf24; display: flex; align-items: center; gap: 10px; }

        .tabs-nav {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px;
        }
        .tab-btn {
            padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: #94a3b8; font-weight: bold; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tab-btn.active { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }

        .content-area {
            background: rgba(255, 255, 255, 0.02); border-radius: 15px; padding: 20px; min-height: 400px;
        }
        .tab-pane { display: none; animation: fadeIn 0.4s ease; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center;
        }
        .btn {
            padding: 8px 16px; border-radius: 10px; border: none; font-weight: bold;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; color: #fff;
        }
        .btn-primary { background: #3b82f6; }
        .btn-success { background: #22c55e; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; }

        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%; border-collapse: collapse; color: #cbd5e1;
        }
        th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: #fbbf24; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 999;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1); color: #fff; animation: slideUp 0.3s ease;
        }
        .modal-box h3 { color: #fbbf24; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { color: #94a3b8; font-size: 0.9rem; display: block; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: #0f172a; color: #fff; outline: none;
        }

        .search-box { display: flex; gap: 10px; align-items: center; }
        .search-box input {
            padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: #0f172a; color: #fff; outline: none; width: 200px;
        }
        .search-box input:focus { border-color: #fbbf24; }

        @media (max-width: 768px) {
            .glass-container { padding: 15px; }
            .search-box input { width: 120px; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <!-- العنوان -->
        <div class="header">
            <h2><i class="fas fa-coins"></i> الإدارة المالية</h2>
            <div>
                <button class="btn btn-outline" onclick="window.location.href='/dashboard.html'"><i class="fas fa-arrow-left"></i> العودة</button>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="openTab('chart',this)"><i class="fas fa-list"></i> دليل الحسابات</button>
            <button class="tab-btn" onclick="openTab('journal',this)"><i class="fas fa-pen"></i> قيد اليومية</button>
            <button class="tab-btn" onclick="openTab('ledger',this)"><i class="fas fa-book"></i> الأستاذ العام</button>
            <button class="tab-btn" onclick="openTab('cashbox',this)"><i class="fas fa-coins"></i> الصندوق</button>
            <button class="tab-btn" onclick="openTab('pnl',this)"><i class="fas fa-chart-line"></i> الأرباح والخسائر</button>
        </div>

        <div class="content-area">

            <!-- 1. دليل الحسابات -->
            <div id="chart" class="tab-pane active">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="openModal('addAccountModal')"><i class="fas fa-plus"></i> إضافة حساب</button>
                    <div class="search-box" style="margin-right: auto;">
                        <input type="text" placeholder="بحث عن حساب...">
                        <button class="btn btn-outline"><i class="fas fa-search"></i></button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>رقم الحساب</th><th>اسم الحساب</th><th>النوع</th><th>الرصيد</th></tr></thead>
                        <tbody id="accountsBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 2. قيد اليومية -->
            <div id="journal" class="tab-pane">
                <div class="toolbar">
                    <button class="btn btn-success" onclick="openModal('addJournalModal')"><i class="fas fa-plus"></i> إضافة قيد</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>التاريخ</th><th>الشرح</th><th>مدين</th><th>دائن</th></tr></thead>
                        <tbody id="journalBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. الأستاذ العام -->
            <div id="ledger" class="tab-pane">
                <div class="toolbar">
                    <div class="search-box">
                        <input type="text" placeholder="رقم الحساب أو الاسم...">
                        <button class="btn btn-primary">عرض الحركة</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>التاريخ</th><th>الشرح</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
                        <tbody id="ledgerBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 4. الصندوق -->
            <div id="cashbox" class="tab-pane">
                <div class="toolbar">
                    <button class="btn btn-success"><i class="fas fa-plus"></i> إيداع / سحب</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>التاريخ</th><th>العملية</th><th>المبلغ</th><th>الرصيد التراكمي</th></tr></thead>
                        <tbody id="cashBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 5. الأرباح والخسائر -->
            <div id="pnl" class="tab-pane">
                <h4 style="color: #fbbf24; margin-bottom: 15px;">تقرير الأرباح والخسائر (يناير 2026)</h4>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>البيان</th><th>المبلغ (د.ع)</th></tr></thead>
                        <tbody id="pnlBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- النوافذ المنبثقة -->
    <div class="modal-overlay" id="addAccountModal">
        <div class="modal-box">
            <h3>إضافة حساب جديد</h3>
            <div class="form-group"><label>اسم الحساب</label><input type="text"></div>
            <div class="form-group"><label>نوع الحساب</label>
                <select><option>أصول</option><option>خصوم</option><option>إيرادات</option><option>مصروفات</option></select>
            </div>
            <div class="form-group"><label>الرصيد الافتتاحي</label><input type="number"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn btn-success" onclick="closeModal('addAccountModal')">حفظ</button>
                <button class="btn btn-danger" style="background:#ef4444;" onclick="closeModal('addAccountModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addJournalModal">
        <div class="modal-box">
            <h3>إضافة قيد يومية</h3>
            <div class="form-group"><label>التاريخ</label><input type="date"></div>
            <div class="form-group"><label>الشرح</label><input type="text" placeholder="تفاصيل القيد"></div>
            <div class="form-group"><label>المبلغ</label><input type="number"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn btn-success" onclick="closeModal('addJournalModal')">تسجيل</button>
                <button class="btn btn-danger" style="background:#ef4444;" onclick="closeModal('addJournalModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const FKEY='almahasib_finance_v2';
        const baseAccounts=[{code:'1101',name:'الصندوق الرئيسي',type:'أصول'},{code:'1102',name:'البنوك',type:'أصول'},{code:'1201',name:'العملاء',type:'أصول'},{code:'2101',name:'الموردون',type:'خصوم'},{code:'4101',name:'إيرادات المبيعات',type:'إيرادات'},{code:'5101',name:'تكلفة المبيعات',type:'مصروفات'},{code:'5201',name:'مصروفات تشغيلية',type:'مصروفات'},{code:'3101',name:'رأس المال',type:'حقوق ملكية'}];
        function salesData(){let a=[];try{a=JSON.parse(localStorage.getItem('hawa_dijla_invoices')||'[]')}catch(e){}return a}
        function state(){let s;try{s=JSON.parse(localStorage.getItem(FKEY)||'null')}catch(e){}return s||{accounts:baseAccounts,journal:[]}}
        function save(s){localStorage.setItem(FKEY,JSON.stringify(s))}
        function syncAutomatic(){
          const s=state(),seen=new Set(s.journal.map(x=>x.ref)),sales=salesData();
          sales.forEach(x=>{const ref=x.invoiceNo||x.id;if(!ref||seen.has(ref))return;const total=Number(x.total||0),received=Number(x.received||0);s.journal.push({date:x.at||new Date().toISOString(),ref,desc:'بيع - '+(x.customer?.name||x.ref||'نقدي'),debit:total,credit:total,cash:received,type:'sale'});seen.add(ref)});
          try{const inv=JSON.parse(localStorage.getItem('warehouse_receipts')||'[]');inv.forEach(x=>{const ref=x.transactionNo||x.id;if(ref&&!seen.has(ref)){const total=Number(x.total||x.amount||0);s.journal.push({date:x.at||x.date||new Date().toISOString(),ref,desc:'استلام مشتريات/مورد',debit:total,credit:total,cash:-Number(x.paid||0),type:'purchase'});seen.add(ref)}})}catch(e){}
          save(s);return s
        }
        function fmt(n){return Number(n||0).toLocaleString('ar-IQ')+' د.ع'}
        function renderFinance(){
          const s=syncAutomatic(),sales=salesData(),revenue=sales.filter(x=>x.paymentStatus!=='returned').reduce((a,x)=>a+Number(x.total||0),0);
          const expenses=s.journal.filter(x=>x.type==='purchase'||x.type==='expense').reduce((a,x)=>a+Number(x.debit||0),0);
          const cash=s.journal.reduce((a,x)=>a+Number(x.cash||0),0);
          document.getElementById('accountsBody').innerHTML=s.accounts.map(a=>'<tr><td>'+a.code+'</td><td>'+a.name+'</td><td>'+a.type+'</td><td>'+fmt(a.name==='الصندوق الرئيسي'?cash:a.name==='إيرادات المبيعات'?revenue:0)+'</td></tr>').join('');
          document.getElementById('journalBody').innerHTML=s.journal.slice().reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleDateString('ar-IQ')+'</td><td>'+x.desc+'<br><small>'+x.ref+'</small></td><td>'+fmt(x.debit)+'</td><td>'+fmt(x.credit)+'</td></tr>').join('')||'<tr><td colspan="4">لا توجد قيود بعد</td></tr>';
          let bal=0;document.getElementById('ledgerBody').innerHTML=s.journal.map(x=>{bal+=Number(x.debit||0)-Number(x.credit||0);return '<tr><td>'+new Date(x.date).toLocaleDateString('ar-IQ')+'</td><td>'+x.desc+'</td><td>'+fmt(x.debit)+'</td><td>'+fmt(x.credit)+'</td><td>'+fmt(bal)+'</td></tr>'}).join('');
          let cb=0;document.getElementById('cashBody').innerHTML=s.journal.filter(x=>x.cash).map(x=>{cb+=Number(x.cash);return '<tr><td>'+new Date(x.date).toLocaleString('ar-IQ')+'</td><td>'+x.desc+'</td><td>'+fmt(x.cash)+'</td><td>'+fmt(cb)+'</td></tr>'}).join('');
          document.getElementById('pnlBody').innerHTML='<tr><td>إجمالي الإيرادات</td><td style="color:#22c55e">'+fmt(revenue)+'</td></tr><tr><td>إجمالي المصروفات/المشتريات</td><td style="color:#ef4444">'+fmt(expenses)+'</td></tr><tr><td><b>صافي النتيجة</b></td><td style="color:#fbbf24"><b>'+fmt(revenue-expenses)+'</b></td></tr>';
        }
        window.addEventListener('storage',renderFinance);document.addEventListener('DOMContentLoaded',renderFinance);
        function openTab(tabId,btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        function openModal(id) {
            document.getElementById(id).classList.add('open');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }
    </script>
    <script src="/offline-sync.js" defer></script>
</body>
</html>
