<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/erp-offline.js"></script><title>دخول الشركة | المحاسب برو</title><link rel="stylesheet" href="/app-ui.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#133342,#146d67);font:15px 'Segoe UI',Tahoma;color:#173449}.login-card{box-sizing:border-box;width:min(420px,calc(100% - 32px));padding:30px;background:white;border-radius:22px}h1{font-size:25px;margin:0 0 24px}label{display:block;margin:15px 0}input{box-sizing:border-box;width:100%;height:44px;margin-top:7px;padding:10px;border:1px solid #d7e3e8;border-radius:10px;font:inherit}button{width:100%;height:44px;background:#146d67;color:white;border:0;border-radius:10px;font:inherit;font-weight:600}a{display:block;margin-top:18px;text-align:center;color:#146d67}#notice{line-height:1.7;color:#9d2546}button:disabled{opacity:.6}</style><script src="/password-visibility.js" defer></script><script src="/login.js" defer></script></head><body><main class="login-card"><h1>المحاسب برو</h1><form id="login"><label>رمز الشركة<input name="companyCode" required autocomplete="organization" spellcheck="false"></label><label>اسم المستخدم<input name="username" required autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button>تسجيل الدخول</button></form><p id="notice" role="status" hidden></p><a href="/register.html">طلب إنشاء حساب</a><a href="/developer.html">دخول المطور</a></main></body></html>
